# This Resource Definition of type `sqs` provisions an Amazon SQS service
# It co-provisions an aws-policy resource with the appropriate permission set
apiVersion: entity.humanitec.io/v1b1
kind: Definition
metadata:
  id: wi-aws-sqs
entity:
  driver_type: humanitec/opentofu-container-runner-builtin
  name: wi-aws-sqs
  type: sqs
  driver_inputs:
    values:
      variables:
        app_id: "${context.app.id}"
        env_id: "${context.env.id}"
        res_id: "${context.res.id}"
        region: ${resources['config.default#app-config'].outputs.region}
      files:
        providers.tf: |
          terraform {
            required_providers {
              aws = {
                source  = "hashicorp/aws"
              }
              random = {
                source  = "hashicorp/random"
              }
            }
          }
        variables.tf: |
          locals {
            workload_id = split(".", var.res_id)[1]
          }
          variable "app_id" {}
          variable "env_id" {}
          variable "res_id" {}
          variable "region" {}
        main.tf: |
          # Provider credentials are being injected through environment variables
          # via the EKS workload identity setup
          provider "aws" {
            region = var.region
            default_tags {
              tags = {
                humanitec  = "true"
                hum-app    = var.app_id
                hum-env    = var.env_id
                hum-res    = replace(var.res_id, ".", "-")
                managed-by = "terraform"
              }
            }
          }
          resource "random_string" "sqs_name" {
            length  = 10
            special = false
            lower   = true
            upper   = false
          }
          resource "aws_sqs_queue" "queue" {
            name = random_string.sqs_name.result
          }
        outputs.tf: |
          output "arn" {
            value = aws_sqs_queue.queue.arn
          }
          output "region" {
            value = var.region
          }
          output "url" {
            value = aws_sqs_queue.queue.url
          }
      # Using the default TF backend for simplicity
      use_default_backend: true
  provision:
    # Co-provision an IAM Policy resource of class "sqs-default"
    # By not specifying an ID, the co-provisioned aws-policy will have the same ID as the present resource
    aws-policy.sqs-default:
      match_dependents: true
      params:
        # Get the sqs resource with the class "default" and the same ID as the current resource
        resource_arn: ${resources['sqs.default#@'].outputs.arn}
        # Pass in the actions required for the policy. Modify the list to fit your needs
        actions:
          - "sqs:*"
  # Adjust matching criteria as required
  criteria:
  - app_id: workload-identity-test-aws