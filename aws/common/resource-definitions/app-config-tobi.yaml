# This Resource Definition of type "config" uses the Echo Driver to provide configuration values
# to other Resource Definitions for accessing the AWS Project
apiVersion: entity.humanitec.io/v1b1
kind: Definition
metadata:
  id: wi-aws-app-config
entity:
  name: wi-aws-app-config
  type: config
  driver_type: humanitec/echo
  driver_inputs:
    values:
      region: eu-north-1
  criteria:
    - class: default
      res_id: app-config
      env_type: development
      app_id: workload-identity-test-aws