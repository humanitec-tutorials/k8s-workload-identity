# This Resource Definition of type `azure-storage-account` implements a "Delegator" resource
apiVersion: entity.humanitec.io/v1b1
kind: Definition
metadata:
  id: wi-azure-storage-account-delegator
entity:
  driver_type: humanitec/template
  name: wi-azure-storage-account-delegator
  type: azure-storage-account
  driver_inputs:
    values:
      # Referencing the "concrete" Resource to create it and get its id output
      id: ${resources['azure-storage-account.default'].outputs.id}
      # Also forward the storage account name from the "concrete" Resource
      account: ${resources['azure-storage-account.default'].outputs.account}
      # This Resource selector retrieves the principal_ids of the Azure managed identity resources
      # of all workloads depending on the present storage account resource
      # 1. Start with the azure-storage-account resource with the same ("@") class and ID as the present resource
      #    This effectively matches the present resource
      # 2. Find all the workloads that depend on that azure-storage-account
      # 3. Find all the azure-managed-identity resources that these workloads depend on
      # 4. For each azure-managed-identity, read its "principal_id" output
      principal_ids: ${resources['azure-storage-account.@#@<workload>azure-managed-identity'].outputs.principal_id}
      # The class of the present resource, used to look up the Azure role to grant
      res_class: ${context.res.class}
      # Maps an access class to the Azure built-in role it grants.
      # Add further entries here to support additional access classes.
      role_definition_names:
        azure-storage-blob-contributor: Storage Blob Data Contributor
        azure-storage-blob-data-reader: Storage Blob Data Reader
      templates:
        init: |
          id: {{ .driver.values.id | toRawJson }}
          account: {{ .driver.values.account | toRawJson }}
          principal_ids: {{ .driver.values.principal_ids | toRawJson }}
          role_definition_name: {{ get .driver.values.role_definition_names .driver.values.res_class | toRawJson }}
        outputs: |
          id: {{ .init.id | toRawJson }}
          account: {{ .init.account | toRawJson }}
          principal_ids: {{ .init.principal_ids | toRawJson }}
          role_definition_name: {{ .init.role_definition_name | toRawJson }}
  # Coprovision an azure-role-assignments resource for this storage account
  # Make it dependent to that it may access the id of the present Azure storage account
  # By not specifying a class and ID, the co-provisioned azure-role-assignments will have
  # the same class and ID as the present resource
  provision:
    azure-role-assignments:
      is_dependent: true
      params:
        # "id" is an output of the present resource
        scope: ${resources['azure-storage-account.@#@'].outputs.id}
        # "principal_ids" is an output of the present resource
        # Collecting the principal_ids requires the use of a resource selector
        # and these are not supported in co-provisioning "params"
        principal_ids: ${resources['azure-storage-account.@#@'].outputs.principal_ids}
        role_definition_name: ${resources['azure-storage-account.@#@'].outputs.role_definition_name}
  # Adjust matching criteria as required, but must match all access classes
  criteria:
  - class: azure-storage-blob-contributor
    app_id: workload-identity-test-azure
  - class: azure-storage-blob-data-reader
    app_id: workload-identity-test-azure
