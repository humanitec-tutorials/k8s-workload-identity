apiVersion: score.dev/v1b1
metadata:
  name: hello-azure-3
containers:
  hello-world:
    image: .
    command: ["sleep","infinity"]
    variables:
      STORAGE_2_ACCOUNT: ${resources.storage-2.account}
      QUEUE_1_QUEUE: ${resources.queue-1.queue}
resources:
  storage-2:
    type: azure-storage-account
    class: azure-storage-blob-data-reader
    id: storage-2
  queue-1:
    type: azure-service-bus-queue
    class: azure-service-bus-data-owner
    id: queue-1