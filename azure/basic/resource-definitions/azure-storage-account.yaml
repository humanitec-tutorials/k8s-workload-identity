# This Resource Definition creates an Azure storage account
# with a default Blob container
apiVersion: entity.humanitec.io/v1b1
kind: Definition
metadata:
  id: wi-azure-storage-account
entity:
  driver_type: humanitec/opentofu-container-runner-builtin
  name: wi-azure-storage-account
  type: azure-storage-account
  driver_inputs:
    values:
      files:
        input_vars.auto.tfvars.json: |
          {
            "resource_group_name": "${resources['config.default#app-config'].outputs.resource_group_name}",
            "location"           : "${resources['config.default#app-config'].outputs.location}",
            "resource_guresid"   : "${context.res.guresid}"
          }
        main.tf: |
          resource "azurerm_storage_account" "this" {
            name                     = substr(var.resource_guresid, 0, 24)
            resource_group_name      = var.resource_group_name
            location                 = var.location
            account_tier             = "Standard"
            account_replication_type = "ZRS"
          }
          resource "azurerm_storage_container" "example" {
            name                  = "example"
            storage_account_id    = azurerm_storage_account.this.id
            container_access_type = "private"
          }
        outputs.tf: |
          output "account" {
            value = azurerm_storage_account.this.name
          }
          output "id" {
            value = azurerm_storage_account.this.id
          }
          output "principal_ids" {
            # This Resource selector retrieves the principal_ids of the Azure managed identity resources
            # of all workloads depending on the present storage account resource
            value = ${resources['azure-storage-account.@#@<workload>azure-managed-identity'].outputs.principal_id}
          }
        providers.tf: |
          terraform {
            required_providers {
              azurerm = {
                source  = "hashicorp/azurerm"
                version = ">=4.78.0"
              }
            }
          }
          provider "azurerm" {
            features {}
          }
        variables.tf: |
          variable "resource_group_name" {}
          variable "location" {}
          variable "resource_guresid" {}
      runner:
        variables:
          ARM_SUBSCRIPTION_ID: ${resources['config.default#app-config'].outputs.subscription_id}
          ARM_USE_CLI: '''false'''
          ARM_USE_AKS_WORKLOAD_IDENTITY: '''true'''
        # Setup for runner workload identity
        pod_template: |
          metadata:
            labels:
              azure.workload.identity/use: "true"
          spec:
            serviceAccountName: humanitec-runner
      # Using the default TF backend for simplicity
      use_default_backend: true
  # Coprovision an azure-role-assignments resource for this storage account
  # Make it dependent to that it may access the id of the present Azure storage account
  # By not specifying an ID, the co-provisioned azure-role-assignments will have the same ID as the present resource
  provision:
    azure-role-assignments:
      is_dependent: true
      params:
        scope: ${resources['azure-storage-account.@#@'].outputs.id} # Output of the present resource
        principal_ids: ${resources['azure-storage-account.@#@'].outputs.principal_ids} # Output of the present resource
        role_definition_name: "Storage Blob Data Contributor"
  criteria:
    - app_id: workload-identity-test-azure
